name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK Platform 36 installieren
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Mobile-Vertrag prüfen
        run: npm run test:mobile-contract

      - name: Echte Mobile-App bauen
        run: npm run build

      - name: Android-Projekt frisch erzeugen
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Android für Box und Deep Links konfigurieren
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          if 'android.permission.CAMERA' not in s:
              s = s.replace(
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />',
                  1,
              )

          app_match = re.search(r'<application\b[^>]*>', s)
          if not app_match:
              raise SystemExit("<application> fehlt im AndroidManifest")
          app_tag = app_match.group(0)
          if 'android:usesCleartextTraffic=' in app_tag:
              new_tag = re.sub(
                  r'android:usesCleartextTraffic="[^"]*"',
                  'android:usesCleartextTraffic="true"',
                  app_tag,
              )
          else:
              new_tag = app_tag[:-1] + ' android:usesCleartextTraffic="true">'
          s = s[:app_match.start()] + new_tag + s[app_match.end():]

          deep_links = '''
                <intent-filter>
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <category android:name="android.intent.category.BROWSABLE" />
                    <data android:scheme="schiessportal" android:host="box" android:pathPrefix="/" />
                </intent-filter>
                <intent-filter android:autoVerify="true">
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <category android:name="android.intent.category.BROWSABLE" />
                    <data android:scheme="https" android:host="schiessportal.com" android:pathPrefix="/app/box/" />
                </intent-filter>
          '''
          if 'android:scheme="schiessportal"' not in s:
              s = s.replace('</activity>', deep_links + '\n        </activity>', 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Gradle Wrapper prüfen
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --version

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: APK prüfen
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: schiessportal-android-1.2.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
