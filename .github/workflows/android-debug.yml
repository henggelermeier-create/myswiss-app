name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK Platform 36 installieren
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Mobile-Vertrag prüfen
        run: npm run test:mobile-contract

      - name: Echte Mobile-App bauen
        run: npm run build

      - name: Android-Projekt frisch erzeugen
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Android für QR, Box, Deep Links und Logo konfigurieren
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          if 'android.permission.CAMERA' not in text:
              text = text.replace(
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />',
                  1,
              )

          app_match = re.search(r'<application\b[^>]*>', text)
          if not app_match:
              raise SystemExit("<application> fehlt im AndroidManifest")

          app_tag = app_match.group(0)
          if 'android:usesCleartextTraffic=' in app_tag:
              app_tag = re.sub(
                  r'android:usesCleartextTraffic="[^"]*"',
                  'android:usesCleartextTraffic="true"',
                  app_tag,
              )
          else:
              app_tag = app_tag[:-1] + ' android:usesCleartextTraffic="true">'
          text = text[:app_match.start()] + app_tag + text[app_match.end():]

          if 'com.google.mlkit.vision.DEPENDENCIES' not in text:
              app_match = re.search(r'<application\b[^>]*>', text)
              metadata = '        <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />'
              text = text[:app_match.end()] + '\n' + metadata + text[app_match.end():]

          if 'android:scheme="schiessportal"' not in text:
              deep_links = "\n".join([
                  '                <intent-filter>',
                  '                    <action android:name="android.intent.action.VIEW" />',
                  '                    <category android:name="android.intent.category.DEFAULT" />',
                  '                    <category android:name="android.intent.category.BROWSABLE" />',
                  '                    <data android:scheme="schiessportal" android:host="box" android:pathPrefix="/" />',
                  '                </intent-filter>',
                  '                <intent-filter android:autoVerify="true">',
                  '                    <action android:name="android.intent.action.VIEW" />',
                  '                    <category android:name="android.intent.category.DEFAULT" />',
                  '                    <category android:name="android.intent.category.BROWSABLE" />',
                  '                    <data android:scheme="https" android:host="schiessportal.com" android:pathPrefix="/app/box/" />',
                  '                </intent-filter>',
              ])
              text = text.replace('</activity>', deep_links + '\n        </activity>', 1)

          manifest.write_text(text, encoding="utf-8")

          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text(encoding="utf-8")
          gradle_text = re.sub(r'versionCode\s+\d+', 'versionCode 10204', gradle_text)
          gradle_text = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.2.4"', gradle_text)
          gradle.write_text(gradle_text, encoding="utf-8")

          drawable = Path("android/app/src/main/res/drawable/schiessportal_logo_foreground.xml")
          drawable.parent.mkdir(parents=True, exist_ok=True)
          drawable.write_text("\n".join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="64" android:viewportHeight="64">',
              '  <path android:pathData="M32,4a28,28 0,0 1,0 56" android:fillColor="@android:color/transparent" android:strokeColor="#1F2937" android:strokeWidth="2.4" android:strokeLineCap="round" />',
              '  <path android:pathData="M32,4a28,28 0,0 0,0 56" android:fillColor="@android:color/transparent" android:strokeColor="#1F2937" android:strokeWidth="2.4" android:strokeLineCap="round" />',
              '  <path android:pathData="M32,13a19,19 0,0 1,15.5 30" android:fillColor="@android:color/transparent" android:strokeColor="#1F2937" android:strokeWidth="2.4" android:strokeLineCap="round" />',
              '  <path android:pathData="M32,51a19,19 0,0 1,-15.5 -8" android:fillColor="@android:color/transparent" android:strokeColor="#1F2937" android:strokeWidth="2.4" android:strokeLineCap="round" />',
              '  <path android:pathData="M24,32H6M24,32l-6,-6H8" android:fillColor="@android:color/transparent" android:strokeColor="#1F2937" android:strokeWidth="2.4" android:strokeLineCap="round" android:strokeLineJoin="round" />',
              '  <path android:pathData="M40,32h18M40,32l6,6h10" android:fillColor="@android:color/transparent" android:strokeColor="#DC2626" android:strokeWidth="2.4" android:strokeLineCap="round" android:strokeLineJoin="round" />',
              '  <path android:pathData="M32,26a6,6 0,1 0,0 12a6,6 0,1 0,0 -12" android:fillColor="#DC2626" />',
              '</vector>',
          ]), encoding="utf-8")

          adaptive = "\n".join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">',
              '  <background android:drawable="@android:color/white" />',
              '  <foreground android:drawable="@drawable/schiessportal_logo_foreground" />',
              '</adaptive-icon>',
          ])
          for icon_name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
              icon = Path("android/app/src/main/res/mipmap-anydpi-v26") / icon_name
              icon.parent.mkdir(parents=True, exist_ok=True)
              icon.write_text(adaptive, encoding="utf-8")
          PY

      - name: Gradle Wrapper prüfen
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --version

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: APK technisch prüfen
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.schiessportal.mobile.v124'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='1.2.4'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -q "android.permission.CAMERA"
          test -s android/app/src/main/res/drawable/schiessportal_logo_foreground.xml

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: schiessportal-android-1.2.4
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
