name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK Platform 36 installieren
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Mobile-Vertrag prüfen
        run: npm run test:mobile-contract

      - name: Echte Mobile-App bauen
        run: npm run build

      - name: Android-Projekt frisch erzeugen
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Android für QR, Box und Deep Links konfigurieren
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          if 'android.permission.CAMERA' not in text:
              text = text.replace(
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />',
                  1,
              )

          app_match = re.search(r'<application\b[^>]*>', text)
          if not app_match:
              raise SystemExit("<application> fehlt im AndroidManifest")

          app_tag = app_match.group(0)
          if 'android:usesCleartextTraffic=' in app_tag:
              app_tag = re.sub(
                  r'android:usesCleartextTraffic="[^"]*"',
                  'android:usesCleartextTraffic="true"',
                  app_tag,
              )
          else:
              app_tag = app_tag[:-1] + ' android:usesCleartextTraffic="true">'
          text = text[:app_match.start()] + app_tag + text[app_match.end():]

          if 'com.google.mlkit.vision.DEPENDENCIES' not in text:
              app_match = re.search(r'<application\b[^>]*>', text)
              metadata = '        <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />'
              text = text[:app_match.end()] + '\n' + metadata + text[app_match.end():]

          if 'android:scheme="schiessportal"' not in text:
              deep_links = "\n".join([
                  '                <intent-filter>',
                  '                    <action android:name="android.intent.action.VIEW" />',
                  '                    <category android:name="android.intent.category.DEFAULT" />',
                  '                    <category android:name="android.intent.category.BROWSABLE" />',
                  '                    <data android:scheme="schiessportal" android:host="box" android:pathPrefix="/" />',
                  '                </intent-filter>',
                  '                <intent-filter android:autoVerify="true">',
                  '                    <action android:name="android.intent.action.VIEW" />',
                  '                    <category android:name="android.intent.category.DEFAULT" />',
                  '                    <category android:name="android.intent.category.BROWSABLE" />',
                  '                    <data android:scheme="https" android:host="schiessportal.com" android:pathPrefix="/app/box/" />',
                  '                </intent-filter>',
              ])
              text = text.replace('</activity>', deep_links + '\n        </activity>', 1)

          manifest.write_text(text, encoding="utf-8")

          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text(encoding="utf-8")
          gradle_text = re.sub(r'versionCode\s+\d+', 'versionCode 10203', gradle_text)
          gradle_text = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.2.3"', gradle_text)
          gradle.write_text(gradle_text, encoding="utf-8")
          PY

      - name: Gradle Wrapper prüfen
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --version

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: APK technisch prüfen
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.schiessportal.mobile.v123'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='1.2.3'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -q "android.permission.CAMERA"

      - name: APK hochladen
        uses: actions/upload-artifact@v6
        with:
          name: schiessportal-android-1.2.3
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
